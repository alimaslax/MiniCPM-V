events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr info;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 7860;
        client_max_body_size 100m;

        # Liveness only: the app may still be downloading/loading the model.
        location = /health {
            default_type application/json;
            return 200 '{"status":"starting"}\n';
        }

        # Verda publishes a continuous deployment below /<deployment-name>/.
        # Strip that platform routing prefix before passing paths to the
        # official demo, whose static UI and WebSockets are rooted at /.
        location = /minicpm-o45-live {
            return 301 /minicpm-o45-live/;
        }

        location /minicpm-o45-live/ {
            proxy_pass http://127.0.0.1:8006/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /minicpm-o45-live;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://127.0.0.1:8006;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
